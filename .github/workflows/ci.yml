# CI: build and unit-test Susurro on macOS (BEA-662 / review plan R5).
# No signing, no release steps: releases stay local (`make release`).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Match the local release toolchain (Xcode 27.2 / Swift 6.4). Swift 6.3 (Xcode 26.x,
    # the macos-26 image) rejects FluidAudio 0.9.1 under strict concurrency, so the
    # xcode-27 image (public preview at the time of writing) is required.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          swift --version
          cmake --version | head -1

      # whisper.cpp static libs only change when the submodule pin or the
      # `make whisper` recipe changes, so key the cache on exactly those.
      - name: whisper.cpp cache key
        id: whisper-key
        run: |
          sub=$(git rev-parse HEAD:vendor/whisper.cpp)
          recipe=$(sed -n '/^whisper:/,/^$/p' Makefile | shasum -a 256 | cut -c1-16)
          xcode=$(xcodebuild -version | head -1 | tr -d ' ')
          echo "key=whisper-${{ runner.os }}-${{ runner.arch }}-${xcode}-${sub}-${recipe}" >> "$GITHUB_OUTPUT"

      - name: Restore whisper.cpp build
        id: whisper-cache
        uses: actions/cache/restore@v4
        with:
          path: build-whisper
          key: ${{ steps.whisper-key.outputs.key }}

      - name: Build whisper.cpp (cache miss only)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: make whisper

      # Save right after the build so a later Swift failure doesn't waste it.
      - name: Save whisper.cpp build
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-whisper
          key: ${{ steps.whisper-key.outputs.key }}

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test
